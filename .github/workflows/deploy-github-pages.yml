# Build the Vite app and deploy static output to GitHub Pages (Actions).
name: Deploy Vite site to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # User/org site (repo named {owner}.github.io) is served at https://{owner}.github.io/
      # with asset base "/". Project sites use https://{owner}.github.io/{repo}/ → base "/{repo}/".
      - name: Set Vite base for GitHub Pages
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          r=$(echo "$repo" | tr '[:upper:]' '[:lower:]')
          want=$(echo "${owner}.github.io" | tr '[:upper:]' '[:lower:]')
          if [ "$r" = "$want" ]; then
            echo "GITHUB_PAGES_BASE=/" >> "$GITHUB_ENV"
            echo "Pages type: user/org site (root URL)"
          else
            echo "GITHUB_PAGES_BASE=/${repo}/" >> "$GITHUB_ENV"
            echo "Pages type: project site → base /${repo}/"
          fi

      - name: Build with Vite
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
